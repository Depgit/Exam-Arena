# Nginx configuration for ExamArena Backend on AWS EC2
server {
    listen 80;
    server_name _; # Replace with your domain name (e.g., api.examarena.com) or EC2 public DNS

    # Global proxy timeout and buffer settings
    client_max_body_size 10M;
    proxy_connect_timeout 75s;

    # Standard REST API Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real-Time WebSocket Connection Upgrade Handling
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-alive settings for long-lived game WebSocket sessions
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
