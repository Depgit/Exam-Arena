version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: examarena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: examarena
      POSTGRES_PASSWORD: examarena_secret
      POSTGRES_DB: examarena
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examarena"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: examarena-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      ENVIRONMENT: "production"
      DATABASE_URL: "postgres://examarena:examarena_secret@postgres:5432/examarena?sslmode=disable"
      JWT_SECRET: "production-secret-change-me-to-64-char-random-string-here-!!!!"
      JWT_EXPIRY_HOURS: "24"
      DB_MAX_CONNS: "25"
      DB_MIN_CONNS: "5"
      RATE_LIMIT_RPS: "100"
      RATE_LIMIT_BURST: "200"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local